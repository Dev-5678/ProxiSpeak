version: '3.8'

services:
  signaling-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: proxispeak-signaling
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/proxispeak
      - USE_REDIS=true
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: proxispeak-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: proxispeak-redis
    ports:
      - "6379:6379"

volumes:
  mongo_data:
